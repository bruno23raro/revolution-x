name: Autonomous Monitor & Fix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Manual trigger

env:
  NODE_VERSION: '20'

jobs:
  monitor:
    name: Scan & Auto-Fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Scan for errors
      id: scan
      run: |
        node agents/autonomous-monitor.js 2>&1 | tee scan-output.txt
        echo "scan_complete=true" >> $GITHUB_OUTPUT

    - name: Detect if fixes were needed
      if: failure()
      run: |
        echo "Fixes detected - attempting automatic resolution"
        npm run fix || echo "Fix script not available"

    - name: Run TypeScript check
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npm run lint -- --fix

    - name: Run tests
      run: npm test -- --passWithNoTests

    - name: Build
      run: npm run build

    - name: Save report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitoring-report
        path: reports/
        retention-days: 30

    - name: Comment on PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/autonomous-report.json', 'utf8'));

          const comment = `
          ## 🤖 Autonomous Monitor Results

          ### Scan Results
          - **Errors Found**: ${report.errorsFound}
          - **Fixes Applied**: ${report.fixesApplied}

          ### Severity Breakdown
          - Critical: ${report.summary.critical}
          - High: ${report.summary.high}
          - Medium: ${report.summary.medium}

          ### Build Status
          ✅ TypeScript: Passed
          ✅ ESLint: Passed
          ✅ Tests: Passed
          ✅ Build: Success

          All checks passed! The system is in good health.
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  deploy:
    name: Deploy to Hostinger
    needs: monitor
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Hostinger
      uses: hostinger/hostinger-deploy@v1
      with:
        domain: revolutionx.com.br
        directory: /var/www/html
        git_branch: main