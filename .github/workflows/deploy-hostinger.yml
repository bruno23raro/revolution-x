# ============================================================================
# Deploy para Hostinger — Build Externo → Deploy Interno (anti-break)
#
# Fluxo:
#   1. GitHub detecta push/merge em `main`
#   2. Roda npm ci + prisma generate + typecheck + lint + testes + build
#      (com `output: 'standalone'` → .next/standalone + .next/static)
#   3. Comprime o artefato standalone em .tar.gz
#   4. Envia via SSH/SCP para o servidor da Hostinger
#   5. Extrai no diretório do app e reinicia via PM2 (zero-downtime reload)
#
# Requer segredos no GitHub (Settings → Secrets and variables → Actions):
#   SSH_HOST            (ex: 212.1.2.3)
#   SSH_USER            (ex: u681336378)
#   SSH_PRIVATE_KEY     (chave privada RSA/Ed25519 do deploy)
#   SSH_PORT            (default 22)
#   DEPLOY_PATH         (ex: /home/u681336378/htdocs/revolutionx.com.br)
#   PM2_APP_NAME        (ex: revolution-x)
#
# AVISO de segurança: push/merge para `main` DISPARA deploy em produção.
# Manter a Git integration do hPanel DESLIGADA quando este workflow estiver
# ativo para evitar deploy duplicado/conflitante.
# ============================================================================

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {} # deploy manual via GitHub UI

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build standalone
    runs-on: ubuntu-latest
    env:
      # Variáveis de build público — sem segredo de produção no CI.
      # As chaves reais (DATABASE_URL etc.) são injetadas só no servidor.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://revolutionx.com.br' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx-standalone
          path: |
            .next/standalone/
            .next/static/
            public/
          if-no-files-found: error

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rx-standalone
          path: dist/

      - name: Prepare release tarball
        run: |
          # Move public/ para dentro do standalone (o servidor serve assets de .next/static)
          mkdir -p dist/standalone/public
          if [ -d "dist/public" ]; then cp -r dist/public/. dist/standalone/public/ 2>/dev/null || true; fi
          if [ -d "dist/static" ]; then cp -r dist/static dist/standalone/.next/static 2>/dev/null || true; fi
          # Cria tarball com caminho relativo (facilita extração no destino)
          tar -C dist/standalone -czf release.tar.gz .
          ls -lh release.tar.gz

      - name: Upload & extract on Hostinger via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "release.tar.gz"
          target: "${{ secrets.DEPLOY_PATH }}/_staging/"

      - name: Restart PM2 app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            PM2_APP="${{ secrets.PM2_APP_NAME || 'revolution-x' }}"
            STAGE="$DEPLOY_PATH/_staging"

            # Extrai o novo release num diretório temporário
            rm -rf "$STAGE/new"
            mkdir -p "$STAGE/new"
            tar -C "$STAGE/new" -xzf "$STAGE/release.tar.gz"

            # Preserva .env e node_modules existentes (se houver)
            # Copy .next standalone files, mantendo configs
            cp -r "$STAGE/new/." "$DEPLOY_PATH/" 2>/dev/null || true

            # Reinicia via PM2 (se existir) senão tenta next start direto
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload "$PM2_APP" 2>/dev/null || pm2 restart "$PM2_APP" 2>/dev/null || echo "PM2 app $PM2_APP não encontrado"
            else
              echo "PM2 não instalado — verificar processo manualmente"
            fi

            # Limpa staging
            rm -rf "$STAGE/new" "$STAGE/release.tar.gz"
            echo "DEPLOY_OK"