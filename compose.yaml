# =============================================================================
# REVOLUTION X — compose de PRODUÇÃO (e homologação em ambiente local)
#
#   docker compose up -d            # db + redis + mailpit + migrate + app
#
# Regras:
#   • Nenhum segredo neste arquivo — tudo via interpolação de .env
#     (docker compose lê .env do diretório de trabalho automaticamente).
#   • Banco: Postgres LOCAL do compose (jamais aponte DATABASE_URL para a
#     produção Supabase aqui — ver CLAUDE.md).
#   • Porta do app NÃO publicada no host por padrão (reverse proxy à
#     frente). Para acesso direto local: `ports: - "3000:3000"` abaixo.
# =============================================================================

name: revolution-x

networks:
  revx:
    driver: bridge

volumes:
  revx_pgdata:
    driver: local
  revx_redisdata:
    driver: local

services:
  # ------------------------------------------------------------------
  # Postgres 17 (mesma major da CI) — volume persistente, healthcheck
  # ------------------------------------------------------------------
  db:
    image: postgres:17
    restart: unless-stopped
    networks: [revx]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revolution_x}
      POSTGRES_USER: ${POSTGRES_USER:-revx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (local)}
    volumes:
      - revx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Porta exposta SOMENTE para tooling local (DBeaver/psql). Comente p/ ocultar.
    # Mudado para 5434 para evitar conflito com Postgres local instalado no host
    ports:
      - "5434:5432"

  # ------------------------------------------------------------------
  # Redis 7 (cache, rate-limit, sessions) — healthcheck
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [revx]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - revx_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "6379:6379"

  # ------------------------------------------------------------------
  # Mailpit (SMTP + Web UI) — captura e-mails transacionais localmente
  # ------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks: [revx]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Migrações SQL manuais (migrations/*.sql) — job one-shot, na ordem
  # 001 → 033. Rode contra banco NOVO; psql ON_ERROR_STOP para não
  # deixar migração parcial. Não é idempotente (ver README-DOCKER.md).
  # ------------------------------------------------------------------
  migrate:
    image: postgres:17
    restart: "no"
    networks: [revx]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: revx
      POSTGRES_DB: revolution_x
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: >
      sh -c 'export PGPASSWORD=$$POSTGRES_PASSWORD; set -e; for f in /migrations/*.sql; do
               echo "==> Aplicando $$f";
               psql -v ON_ERROR_STOP=1
                   -h db -U revx -d "$$POSTGRES_DB" -f "$$f";
             done; echo "==> Migrações concluídas"'

  # ------------------------------------------------------------------
  # Aplicação Next.js (runner não-root) — espera db/redis/mailpit healthy
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inline-ados no bundle client no BUILD (comportamento Next.js).
        # Segredos de runtime (DB, service role, ...) NUNCA passam por ARG.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: revolution-x:local
    restart: unless-stopped
    networks: [revx]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    # A imagem NÃO fixa segredos — lidos em runtime do ambiente.
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Banco interno da rede (substitui o host Supabase neste ambiente)
      DATABASE_URL: postgres://${POSTGRES_USER:-revx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-revolution_x}
      DIRECT_URL: postgres://${POSTGRES_USER:-revx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-revolution_x}
      # Redis (rate-limit, cache, sessões)
      REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_REST_URL: http://redis:6379
      UPSTASH_REDIS_REST_TOKEN: ""
      # Mailpit (SMTP transacional)
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: "Revolution X <noreply@revolution-x.local>"
      EMAIL_FROM: "Revolution X <noreply@revolution-x.local>"
      # Autenticação / Supabase (servidor)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://ardpabjoepzhkpmkgwgu.supabase.co}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      # Cron (gatilho externo POST /api/cron/tiktok — agendado FORA do app)
      CRON_SECRET: ${CRON_SECRET:-}
      # Meta / WhatsApp
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:-}
      # TikTok OAuth (Content Posting API)
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      # IA (Centro Administrativo)
      OMNIROUTER_BASE_URL: ${OMNIROUTER_BASE_URL:-}
      OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    ports:
      - "3000:3000"